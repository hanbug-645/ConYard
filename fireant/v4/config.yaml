# FireAnt Agent Framework Configuration

meta_prompt: |
  CRITICAL INSTRUCTIONS - READ CAREFULLY:
  
  1. SMALL TASK CHUNKS: Break down every task into the smallest possible atomic units.
     - Each component should do ONE thing only
     - Each file should be under 1000 lines of code
     - Each function should be under 200 lines
     - Prefer many small files over few large files
  
  2. OUTPUT LENGTH LIMIT: Your response MUST be under 1000 words.
     - Be extremely concise
     - No verbose explanations
     - Focus on essential code/content only
     - If a task requires more than 1000 words, it's too large - break it down further
  
  3. MINIMAL SCOPE:
     - Do the minimum viable implementation
     - No premature optimization
     - No extra features beyond requirements
     - Simple, direct solutions only

gemini:
  # API key is loaded from secrets.yaml (not tracked in git)
  model: "gemini-2.5-flash"
  default_temperature: 0.7
  max_output_tokens: 8192
  top_p: 0.95
  max_concurrent_llm_calls: 10
  llm_retries: 3
  llm_retry_backoff: 2.0

agents:
  manager:
    temperature: 0.6
    system_prompt: "You are a product manager creating PRDs for Kaplay web games. Kaplay is a JavaScript game framework loaded via CDN. Expand user requests into detailed PRDs covering gameplay, mechanics, and visual design. Always assume Kaplay as the game framework."

  pm:
    temperature: 0.5
    max_tasks_per_iteration: 3
    system_prompt: "You are a technical PM driving project execution. Given a PRD and the set of verified (green) source files, identify what is missing and produce granular task signals. Determine the correct dependency layer for each task. Output JSON only."

  engineer:
    temperature: 0.7
    max_defer_requeues: 3
    system_prompt: "You are a Kaplay engineer. Write ONLY the assigned file. Kaplay is available globally, and project files may use ES modules. Never invent functions, properties, or dependencies not present in the contract or context. Never reference files outside context. If the contract is impossible to fulfill, output a halt JSON instead of code."

  qa_engineer:
    temperature: 0.4
    system_prompt: "You are a QA engineer. Write unit tests for the given code files. Tests must be self-contained, use only built-in test frameworks, and cover key behaviors from the PRD plus edge cases. Return ONLY the test source code."

escalation:
  max_retries: 3
  fail_threshold: 3

fault_tolerance:
  pm_stall_threshold: 3     # iterations with no new green files before flushing stuck tasks

redis:
  url: "redis://localhost:6379"
  prefix: "fireant:"

workers:
  engineers: 3
  qa_engineers: 1

logging:
  level: "INFO"
  file: "fireant.log"
